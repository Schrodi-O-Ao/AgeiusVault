<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lock-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M32 4 L56 16 V32 C56 46 44 56 32 60 C20 56 8 46 8 32 V16 L32 4Z" 
        fill="url(#shield-gradient)" 
        stroke="#059669" 
        stroke-width="2"/>
  
  <!-- Lock Body -->
  <rect x="22" y="28" width="20" height="16" rx="2" 
        fill="url(#lock-gradient)" 
        stroke="#b45309" 
        stroke-width="1.5"/>
  
  <!-- Lock Shackle -->
  <path d="M26 28 V22 C26 18 38 18 38 22 V28" 
        stroke="#b45309" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Lock Keyhole -->
  <circle cx="32" cy="36" r="3" 
          fill="#78350f"/>
  <rect x="31" y="36" width="2" height="4" 
        fill="#78350f"/>
  
  <!-- Subtle Highlight -->
  <path d="M32 6 L54 17 V32 C54 45 43 54 32 58" 
        fill="none" 
        stroke="white" 
        stroke-width="1" 
        opacity="0.3"/>
</svg>